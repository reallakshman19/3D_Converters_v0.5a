name: GLRD real-browser baseline Preview and enriched XML
on:
  push:
    branches:
      - test/glrd-step4-baseline-capture-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate harness source before capture
        run: |
          node --check tests/glrd_phase4_browser_export_capture.mjs
          python3 -m py_compile tests/glrd_build_reference_browser_config.py
          python3 -m pip install --quiet openpyxl
      - name: Checkout untouched immutable main baseline
        run: |
          mkdir -p /tmp/glrd/input /tmp/glrd/output
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/product
          git -C /tmp/glrd/product checkout --detach a3b3d7e329686ceff419d2399ee153986bcab23f
          test "$(git -C /tmp/glrd/product rev-parse HEAD)" = "a3b3d7e329686ceff419d2399ee153986bcab23f"
          test -z "$(git -C /tmp/glrd/product status --porcelain --untracked-files=no)"
      - name: Fetch and attest pinned GLRD source files and master data
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/reallakshman19/3D_Converters/3377b7f4baeeee5851e72dcc414d6c4a93f5a933/Benchmarks/XML-CII-2019/revamped"
          MST="https://raw.githubusercontent.com/reallakshman19/3D_Converters/25db94769994751bb0fb6e6d83a578efd9ac8162/docs/docs/Masters"
          cd /tmp/glrd/input
          curl --retry 4 -fLsS "$SRC/GLRD-1000-PSI-02.xml" -o source.xml
          curl --retry 4 -fLsS "$SRC/STF_2026Nov03-0839_managed_stage.json" -o staged.json
          curl --retry 4 -fLsS "$SRC/STD-00-PX-4338-01001-0001-02.xlsx" -o linelist.xlsx
          curl --retry 4 -fLsS "$MST/Piping_class_master.json" -o piping-class.json
          curl --retry 4 -fLsS "$MST/wtValveweights.json" -o weight.json
          curl --retry 4 -fLsS "$MST/PCF_MAT_MAP.TXT" -o material-map.txt
          test "$(git hash-object source.xml)" = "8c60c9e58995172d48a9d1ebfa23569db5659f06"
          test "$(git hash-object staged.json)" = "c611f53d6571cae7df51d9ac817a723be493b952"
          test "$(git hash-object linelist.xlsx)" = "717b41959c9ab47811f47ea4270125f5f257e3c2"
          test "$(git hash-object piping-class.json)" = "af218bf3692acd66c93e190635633e14ccfb30ac"
          test "$(git hash-object weight.json)" = "f969d32dfea1bf03eb7dc310d9f3becacad5a4d1"
          test "$(git hash-object material-map.txt)" = "371ce3a1bd854228650847d8f511e98baa5dc5f3"
          sha256sum source.xml staged.json linelist.xlsx piping-class.json weight.json material-map.txt | tee /tmp/glrd/output/pinned-input-sha256.txt
      - name: Prepare fixed browser-effective config from referenced masters
        run: |
          node --input-type=module -e "import {defaultXmlCii2019SupportConfigJson as f} from '/tmp/glrd/product/tabs/xml-cii-2019-standalone/xml-cii-standalone-default-config.js'; process.stdout.write(f());" > /tmp/glrd/input/defaults.json
          python3 tests/glrd_build_reference_browser_config.py \
            --line-list /tmp/glrd/input/linelist.xlsx \
            --piping-class /tmp/glrd/input/piping-class.json \
            --weight /tmp/glrd/input/weight.json \
            --material-map /tmp/glrd/input/material-map.txt \
            --defaults /tmp/glrd/input/defaults.json \
            --out /tmp/glrd/input/config.json \
            --report /tmp/glrd/output/config-provenance.json
          sha256sum /tmp/glrd/input/config.json | tee /tmp/glrd/output/effective-config-sha256.txt
      - name: Capture REAL Chromium Preview and production downstream enriched XML
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          node tests/glrd_phase4_browser_export_capture.mjs \
            --root /tmp/glrd/product \
            --xml /tmp/glrd/input/source.xml \
            --staged /tmp/glrd/input/staged.json \
            --config /tmp/glrd/input/config.json \
            --linelist /tmp/glrd/input/linelist.xlsx \
            --piping-class /tmp/glrd/input/piping-class.json \
            --weight /tmp/glrd/input/weight.json \
            --material-map /tmp/glrd/input/material-map.txt \
            --out /tmp/glrd/output \
            --label baseline \
            --expected-sha a3b3d7e329686ceff419d2399ee153986bcab23f \
            --chromium "$CHROME_BIN"
      - name: Independently verify baseline XML is nonempty and parsable
        run: |
          python3 -c "import pathlib,xml.etree.ElementTree as ET; p=pathlib.Path('/tmp/glrd/output/baseline-enriched.xml');assert p.stat().st_size>1000;ET.parse(p);print('Valid baseline XML bytes',p.stat().st_size)"
      - name: Verify baseline is byte-identical to first successful capture
        run: |
          test "$(sha256sum /tmp/glrd/output/baseline-enriched.xml | cut -d ' ' -f1)" = "f00da45caf73b15e930e4c91d068d8d1bebd1b9ad1452ad0d7b204af9c3a8aa2"
          test "$(sha256sum /tmp/glrd/output/baseline-preview.json | cut -d ' ' -f1)" = "76bedf169f0a6e00e42539e634735d4736f86f205ca0c7be9da145e4c9f0adec"
      - name: Checkout immutable PR2 wall-index candidate
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/candidate
          git -C /tmp/glrd/candidate checkout --detach 814157b162b981c9876f564f3cb0474435c8c37e
          test "$(git -C /tmp/glrd/candidate rev-parse HEAD)" = "814157b162b981c9876f564f3cb0474435c8c37e"
          test -z "$(git -C /tmp/glrd/candidate status --porcelain --untracked-files=no)"
      - name: Capture optimized Phase 1 Preview and genuine downstream enriched XML
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          node tests/glrd_phase4_browser_export_capture.mjs \
            --root /tmp/glrd/candidate \
            --xml /tmp/glrd/input/source.xml \
            --staged /tmp/glrd/input/staged.json \
            --config /tmp/glrd/input/config.json \
            --linelist /tmp/glrd/input/linelist.xlsx \
            --piping-class /tmp/glrd/input/piping-class.json \
            --weight /tmp/glrd/input/weight.json \
            --material-map /tmp/glrd/input/material-map.txt \
            --out /tmp/glrd/output \
            --label optimized \
            --expected-sha 814157b162b981c9876f564f3cb0474435c8c37e \
            --chromium "$CHROME_BIN"
      - name: Compare true browser enriched XML bytes and structured Preview bytes
        run: |
          python3 /tmp/glrd/candidate/tests/glrd_phase4_enriched_parity.py \
            --before /tmp/glrd/output/baseline-enriched.xml \
            --after /tmp/glrd/output/optimized-enriched.xml \
            --before-manifest /tmp/glrd/output/baseline-manifest.json \
            --after-manifest /tmp/glrd/output/optimized-manifest.json \
            --report /tmp/glrd/output/enriched-xml-diff.json
          cmp /tmp/glrd/output/baseline-preview.json /tmp/glrd/output/optimized-preview.json
          printf 'Structured Preview byte diff: ZERO\n' | tee /tmp/glrd/output/preview-diff.txt
          sha256sum /tmp/glrd/output/*enriched.xml | tee /tmp/glrd/output/export-sha256.txt
      - name: Run native GLRD and wall-authority Node regression tests
        run: |
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/glrd/output/baseline-preview.json',encoding='utf8'))['branchRows']
          json.dump([row['branchName'] for row in rows],open('/tmp/glrd/input/branch-names.json','w',encoding='utf8'))
          assert len(rows)==30 and all(row['lineKeyMethod']=='exact' for row in rows)
          PY
          cd /tmp/glrd/candidate
          GLRD_SOURCE_XML=/tmp/glrd/input/source.xml \
          GLRD_STAGE_FILE=/tmp/glrd/input/staged.json \
          GLRD_BRANCH_NAMES_FILE=/tmp/glrd/input/branch-names.json \
          node --test \
            tests/xml-cii-preview-wall-authority-parity.test.mjs \
            tests/xml-cii-preview-wall-evidence-index.test.mjs \
            tests/xml-cii-bore-wall-authority.test.mjs \
            tests/xml-cii-preview-strict-line-authority.test.mjs
          python3 tests/test_glrd_phase4_enriched_parity.py -v
      - name: Checkout pinned separate Phase 2 per-build reuse candidate
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/phase2-candidate
          git -C /tmp/glrd/phase2-candidate checkout --detach d8b9da2bcbb2e676309b0d48e731697d65ec4010
          test "$(git -C /tmp/glrd/phase2-candidate rev-parse HEAD)" = "d8b9da2bcbb2e676309b0d48e731697d65ec4010"
          test -z "$(git -C /tmp/glrd/phase2-candidate status --porcelain --untracked-files=no)"
      - name: Capture Phase 2 Chromium Preview and downstream enriched XML
        run: |
          mkdir -p /tmp/glrd/phase2-output
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node tests/glrd_phase4_browser_export_capture.mjs \
            --root /tmp/glrd/phase2-candidate \
            --xml /tmp/glrd/input/source.xml \
            --staged /tmp/glrd/input/staged.json \
            --config /tmp/glrd/input/config.json \
            --linelist /tmp/glrd/input/linelist.xlsx \
            --piping-class /tmp/glrd/input/piping-class.json \
            --weight /tmp/glrd/input/weight.json \
            --material-map /tmp/glrd/input/material-map.txt \
            --out /tmp/glrd/phase2-output \
            --label optimized \
            --expected-sha d8b9da2bcbb2e676309b0d48e731697d65ec4010 \
            --chromium "$CHROME_BIN"
      - name: Enforce Phase 2 byte-identical Preview and enriched XML against PR2
        run: |
          set -euo pipefail
          python3 /tmp/glrd/phase2-candidate/tests/glrd_phase4_enriched_parity.py \
            --before /tmp/glrd/output/optimized-enriched.xml \
            --after /tmp/glrd/phase2-output/optimized-enriched.xml \
            --before-manifest /tmp/glrd/output/optimized-manifest.json \
            --after-manifest /tmp/glrd/phase2-output/optimized-manifest.json \
            --report /tmp/glrd/output/phase2-enriched-xml-diff.json
          cmp /tmp/glrd/output/optimized-preview.json /tmp/glrd/phase2-output/optimized-preview.json
          printf 'PHASE2 Preview JSON byte diff: ZERO\n' | tee /tmp/glrd/output/phase2-preview-diff.txt
          test "$(sha256sum /tmp/glrd/phase2-output/optimized-enriched.xml | cut -d ' ' -f1)" = "f00da45caf73b15e930e4c91d068d8d1bebd1b9ad1452ad0d7b204af9c3a8aa2"
          cp /tmp/glrd/phase2-output/optimized-enriched.xml /tmp/glrd/output/phase2-enriched.xml
          cp /tmp/glrd/phase2-output/optimized-preview.json /tmp/glrd/output/phase2-preview.json
          cp /tmp/glrd/phase2-output/optimized-manifest.json /tmp/glrd/output/phase2-manifest.json
          cp /tmp/glrd/phase2-output/optimized-capture-report.json /tmp/glrd/output/phase2-capture-report.json
          sha256sum /tmp/glrd/output/*enriched.xml | tee /tmp/glrd/output/all-export-sha256.txt
      - name: Execute Phase 2 targeted native regression and cache invalidation tests
        run: |
          cd /tmp/glrd/phase2-candidate
          GLRD_SOURCE_XML=/tmp/glrd/input/source.xml \
          GLRD_STAGE_FILE=/tmp/glrd/input/staged.json \
          GLRD_BRANCH_NAMES_FILE=/tmp/glrd/input/branch-names.json \
          node --test \
            tests/xml-cii-preview-per-build-cache.test.mjs \
            tests/xml-cii-preview-wall-authority-parity.test.mjs \
            tests/xml-cii-preview-wall-evidence-index.test.mjs \
            tests/xml-cii-bore-wall-authority.test.mjs \
            tests/xml-cii-preview-strict-line-authority.test.mjs
          python3 tests/test_glrd_phase4_enriched_parity.py -v
      - name: Upload baseline and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glrd-browser-baseline-vs-pr2-and-phase2
          path: /tmp/glrd/output/
          if-no-files-found: warn
          retention-days: 14
