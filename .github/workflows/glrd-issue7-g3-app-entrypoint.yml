name: 'Issue 7 G3 real application entrypoint and Preview discovery'
on:
  push:
    branches:
      - audit/glrd-g3-live-workbench-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-containment-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audit-only file changes and dependencies
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ac97022e2b21569367a450eb7591eda695cf8c57 HEAD
          node --check tests/glrd_issue7_g3_app_discovery.mjs
          git diff --name-only ac97022e2b21569367a450eb7591eda695cf8c57 HEAD | while read -r file; do
            case "$file" in
              tests/glrd_issue7_g3_app_discovery.mjs|tests/glrd_issue7_g3_app_run_readiness.mjs|tests/glrd_issue7_g3_app_run_attempt.mjs|.github/workflows/glrd-issue7-g3-app-entrypoint.yml) ;;
              *) echo "Production or unrelated file changed: $file"; exit 1;;
            esac
          done
          python3 -m pip install --quiet openpyxl
      - name: Checkout unchanged Phase 1 and verified capture harness commits
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd/inputs /tmp/glrd/outputs
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/phase1
          git -C /tmp/glrd/phase1 checkout --detach 814157b162b981c9876f564f3cb0474435c8c37e
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/capture
          git -C /tmp/glrd/capture checkout --detach 19efc37c96b314e4e94194e46d348743207fea6c
          test "$(git -C /tmp/glrd/phase1 rev-parse HEAD)" = "814157b162b981c9876f564f3cb0474435c8c37e"
          test "$(git -C /tmp/glrd/capture rev-parse HEAD)" = "19efc37c96b314e4e94194e46d348743207fea6c"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C /tmp/glrd/phase1 status --porcelain --untracked-files=no)"
      - name: Fetch and verify immutable GLRD original references
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/reallakshman19/3D_Converters/3377b7f4baeeee5851e72dcc414d6c4a93f5a933/Benchmarks/XML-CII-2019/revamped"
          MST="https://raw.githubusercontent.com/reallakshman19/3D_Converters/25db94769994751bb0fb6e6d83a578efd9ac8162/docs/docs/Masters"
          cd /tmp/glrd/inputs
          curl --retry 4 -fLsS "$SRC/GLRD-1000-PSI-02.xml" -o source.xml
          curl --retry 4 -fLsS "$SRC/STF_2026Nov03-0839_managed_stage.json" -o staged.json
          curl --retry 4 -fLsS "$SRC/STD-00-PX-4338-01001-0001-02.xlsx" -o linelist.xlsx
          curl --retry 4 -fLsS "$MST/Piping_class_master.json" -o piping-class.json
          curl --retry 4 -fLsS "$MST/wtValveweights.json" -o weight.json
          curl --retry 4 -fLsS "$MST/PCF_MAT_MAP.TXT" -o material-map.txt
          test "$(git hash-object source.xml)" = "8c60c9e58995172d48a9d1ebfa23569db5659f06"
          test "$(git hash-object staged.json)" = "c611f53d6571cae7df51d9ac817a723be493b952"
          test "$(git hash-object linelist.xlsx)" = "717b41959c9ab47811f47ea4270125f5f257e3c2"
          test "$(git hash-object piping-class.json)" = "af218bf3692acd66c93e190635633e14ccfb30ac"
          test "$(git hash-object weight.json)" = "f969d32dfea1bf03eb7dc310d9f3becacad5a4d1"
          test "$(git hash-object material-map.txt)" = "371ce3a1bd854228650847d8f511e98baa5dc5f3"
          sha256sum source.xml staged.json linelist.xlsx piping-class.json weight.json material-map.txt > /tmp/glrd/outputs/input-custody-sha256.txt
      - name: Construct and fingerprint same effective config for both revisions
        run: |
          node --input-type=module -e "import {defaultXmlCii2019SupportConfigJson as f} from '/tmp/glrd/phase1/tabs/xml-cii-2019-standalone/xml-cii-standalone-default-config.js'; process.stdout.write(f());" > /tmp/glrd/inputs/defaults.json
          python3 /tmp/glrd/capture/tests/glrd_build_reference_browser_config.py \
            --line-list /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --defaults /tmp/glrd/inputs/defaults.json \
            --out /tmp/glrd/inputs/config.json \
            --report /tmp/glrd/outputs/config-provenance.json
          test "$(sha256sum /tmp/glrd/inputs/config.json | cut -d ' ' -f1)" = "292246ab4c97cd388265c70ceb3a613dc8d124debdaffd3ef8b2cf25cb049b05"
      - name: Probe real index.html app, source and staged imports and Step 4 navigation
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version | tee /tmp/glrd/outputs/chromium-version.txt
          node tests/glrd_issue7_g3_app_discovery.mjs \
            --root "$PWD" --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs --label baseline \
            --expected-sha "$GITHUB_SHA" --chromium "$CHROME_BIN"
      - name: Compare actual PR2 UI Preview/cache lifecycle under identical GLRD imports
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd/outputs/pr2
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node tests/glrd_issue7_g3_app_discovery.mjs \
            --root /tmp/glrd/phase1 --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs/pr2 --label baseline \
            --expected-sha 814157b162b981c9876f564f3cb0474435c8c37e \
            --chromium "$CHROME_BIN"
      - name: Publish initial-v7 cache and reentry comparison; block on missing observations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/glrd/outputs')
          cand=json.loads((root/'g3-real-workbench-discovery.json').read_text())
          base=json.loads((root/'pr2/g3-real-workbench-discovery.json').read_text())
          for name,entry in [('PR2',base),('PR10',cand)]:
              assert entry['status']=='UI_MASTER_IMPORT_AND_PREVIEW_OBSERVED',f'{name} failed real UI import gate'
              obs=entry['observation']
              assert obs['allMasterImportsVerified'],f'{name} master rows not verified'
              assert obs['uiMappedCount']=='30' and obs['uiUnmappedCount']=='0',f'{name} mapping failure'
              assert obs['previewCacheInitial']['tableRows']==30 and obs['previewCacheReentry']['tableRows']==30
              # Digest drift is an observation, not a harness failure: exact
              # v7 authority must miss rather than serve mismatched input.
          fields=lambda obs:{'initial':obs['previewCacheInitial'],'reentry':obs['previewCacheReentry']}
          result={'schema':'glrd-issue7-active-v7-ui-cache-parity-v1',
            'status':'OBSERVED','source':'actual index.html, 4 master import UI, original XLSX sheet, phase-4 reentry',
            'baselineSha':base['sourceSha'],'candidateSha':cand['sourceSha'],
            'baseline':fields(base['observation']),'candidate':fields(cand['observation']),
            'digestStable':{'baseline':base['observation']['previewCacheInitial']['digest']==base['observation']['previewCacheReentry']['digest'],
              'candidate':cand['observation']['previewCacheInitial']['digest']==cand['observation']['previewCacheReentry']['digest']},
            'expectedInputRows':{'originalXlsxUiLinelistSheet':112,'class':10699,'material':383,'weight':1595},
            'caveat':'This is actual UI Preview/cache lifecycle only; no user-driven Run or downloaded XML captured, G3 export NOT_PROVEN'}
          (root/'v7-active-ui-cache-reentry-compare.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Inspect real Phase 6 review and Phase 10 Run readiness on immutable PR2 UI
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd/outputs/pr2-readiness
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node tests/glrd_issue7_g3_app_run_readiness.mjs \
            --root /tmp/glrd/phase1 --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs/pr2-readiness --label baseline \
            --expected-sha 814157b162b981c9876f564f3cb0474435c8c37e \
            --chromium "$CHROME_BIN"
      - name: Record G3 readiness and outstanding interactive export gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/glrd/outputs')
          o=json.loads((root/'pr2-readiness/g3-real-workbench-discovery.json').read_text())
          assert o['status']=='UI_MASTER_IMPORT_AND_PREVIEW_OBSERVED'
          obs=o['observation']
          assert obs['allMasterImportsVerified'] and obs['uiMappedCount']=='30'
          report={
            'schema':'glrd-issue7-full-ui-readiness-ledger-v1',
            'status':'PARTIAL_G3_ONLY',
            'inputBasis':'original GLRD XML, staged JSON, actual Linelist worksheet 112 rows, original material map, transported class/weight CSV',
            'sourceCommit':o['sourceSha'],
            'preview':{'mapped':obs['uiMappedCount'],'unmapped':obs['uiUnmappedCount'],'cache':obs.get('previewCacheInitial')},
            'review':obs.get('weightReview',{}),
            'runPanel':obs.get('outputPanel',{}),
            'downloadedEnrichedXml':'NOT_PROVEN',
            'exactUiXmlByteParity':'NOT_PROVEN',
            'rationale':'This test opens UI phases but does not invoke Run, approve review, or capture a downloaded XML file'
          }
          (root/'g3-readiness-ledger.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Attempt actual Mode A Run and Chrome Enriched XML download; never auto-approve review
        id: g3_run_attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd/outputs/pr2-run-attempt
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node tests/glrd_issue7_g3_app_run_attempt.mjs \
            --root /tmp/glrd/phase1 --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs/pr2-run-attempt --label baseline \
            --expected-sha 814157b162b981c9876f564f3cb0474435c8c37e \
            --chromium "$CHROME_BIN"
      - name: Record Run attempt status without recasting missing export as PASS
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/glrd/outputs')
          p=root/'pr2-run-attempt/g3-real-workbench-discovery.json'
          if not p.exists():
              out={'schema':'glrd-g3-download-gate-v1','status':'NOT_PROVEN','blocker':'G3 UI Run script did not produce a report'}
          else:
              obj=json.loads(p.read_text())
              obs=obj.get('observation') or {}
              run=obs.get('runAttempt') or {}
              files=obs.get('downloadedFiles') or []
              delivered=[file for file in files if file.get('looksXml') and file.get('bytes',0)>1000]
              out={'schema':'glrd-g3-download-gate-v1',
                'status':'PASS_UI_DOWNLOAD_CAPTURED' if obj['status']=='G3_UI_XML_DOWNLOAD_CAPTURED' and delivered else 'NOT_PROVEN',
                'sourceCommit':obj.get('sourceSha'),'browserRun':run,'physicallyDownloadedXml':delivered,
                'reviewWasAutoApproved':False,
                'scope':'real UI input/import/review/Run click and physical download in Chrome; byte parity with second revision remains separate'}
          (root/'g3-actual-run-download-gate.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Preserve real app observations and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glrd-g3-real-app-entrypoint-discovery
          path: /tmp/glrd/outputs/
          if-no-files-found: warn
          retention-days: 14
