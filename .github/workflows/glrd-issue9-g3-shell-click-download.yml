name: 'GLRD real standalone UI before-after actual downloaded XML parity'
on:
  push:
    branches:
      - audit/glrd-standalone-shell-download-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-containment-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-production-file containment scope and dependencies
        run: |
          set -euo pipefail
          node --check tests/glrd_issue9_standalone_shell_click_download.mjs
          git merge-base --is-ancestor 2b2939051bcd1f24e01163996f890168cfb311d9 HEAD
          git diff --name-only 2b2939051bcd1f24e01163996f890168cfb311d9 HEAD
          git diff --name-only 2b2939051bcd1f24e01163996f890168cfb311d9 HEAD | while read -r file; do
            case "$file" in
              tests/glrd_issue9_standalone_shell_click_download.mjs|.github/workflows/glrd-issue9-g3-shell-click-download.yml) ;;
              *) echo "Unexpected file changed: $file"; exit 1;;
            esac
          done
          python3 -m pip install --quiet openpyxl
      - name: Checkout unchanged Phase 1 and verified capture harness commits
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd/inputs /tmp/glrd/outputs
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/phase1
          git -C /tmp/glrd/phase1 checkout --detach 814157b162b981c9876f564f3cb0474435c8c37e
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/capture
          git -C /tmp/glrd/capture checkout --detach 19efc37c96b314e4e94194e46d348743207fea6c
          test "$(git -C /tmp/glrd/phase1 rev-parse HEAD)" = "814157b162b981c9876f564f3cb0474435c8c37e"
          test "$(git -C /tmp/glrd/capture rev-parse HEAD)" = "19efc37c96b314e4e94194e46d348743207fea6c"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C /tmp/glrd/phase1 status --porcelain --untracked-files=no)"
      - name: Fetch and verify immutable GLRD original references
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/reallakshman19/3D_Converters/3377b7f4baeeee5851e72dcc414d6c4a93f5a933/Benchmarks/XML-CII-2019/revamped"
          MST="https://raw.githubusercontent.com/reallakshman19/3D_Converters/25db94769994751bb0fb6e6d83a578efd9ac8162/docs/docs/Masters"
          cd /tmp/glrd/inputs
          curl --retry 4 -fLsS "$SRC/GLRD-1000-PSI-02.xml" -o source.xml
          curl --retry 4 -fLsS "$SRC/STF_2026Nov03-0839_managed_stage.json" -o staged.json
          curl --retry 4 -fLsS "$SRC/STD-00-PX-4338-01001-0001-02.xlsx" -o linelist.xlsx
          curl --retry 4 -fLsS "$MST/Piping_class_master.json" -o piping-class.json
          curl --retry 4 -fLsS "$MST/wtValveweights.json" -o weight.json
          curl --retry 4 -fLsS "$MST/PCF_MAT_MAP.TXT" -o material-map.txt
          test "$(git hash-object source.xml)" = "8c60c9e58995172d48a9d1ebfa23569db5659f06"
          test "$(git hash-object staged.json)" = "c611f53d6571cae7df51d9ac817a723be493b952"
          test "$(git hash-object linelist.xlsx)" = "717b41959c9ab47811f47ea4270125f5f257e3c2"
          test "$(git hash-object piping-class.json)" = "af218bf3692acd66c93e190635633e14ccfb30ac"
          test "$(git hash-object weight.json)" = "f969d32dfea1bf03eb7dc310d9f3becacad5a4d1"
          test "$(git hash-object material-map.txt)" = "371ce3a1bd854228650847d8f511e98baa5dc5f3"
          sha256sum source.xml staged.json linelist.xlsx piping-class.json weight.json material-map.txt > /tmp/glrd/outputs/input-custody-sha256.txt
      - name: Construct and fingerprint same effective config for both revisions
        run: |
          node --input-type=module -e "import {defaultXmlCii2019SupportConfigJson as f} from '/tmp/glrd/phase1/tabs/xml-cii-2019-standalone/xml-cii-standalone-default-config.js'; process.stdout.write(f());" > /tmp/glrd/inputs/defaults.json
          python3 /tmp/glrd/capture/tests/glrd_build_reference_browser_config.py \
            --line-list /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --defaults /tmp/glrd/inputs/defaults.json \
            --out /tmp/glrd/inputs/config.json \
            --report /tmp/glrd/outputs/config-provenance.json
          test "$(sha256sum /tmp/glrd/inputs/config.json | cut -d ' ' -f1)" = "292246ab4c97cd388265c70ceb3a613dc8d124debdaffd3ef8b2cf25cb049b05"
      - name: Checkout isolated containment candidate immutable commit
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/reallakshman19/3D_Converters_v0.5a.git /tmp/glrd/candidate
          git -C /tmp/glrd/candidate checkout --detach 2b2939051bcd1f24e01163996f890168cfb311d9
          test "$(git -C /tmp/glrd/candidate rev-parse HEAD)" = 2b2939051bcd1f24e01163996f890168cfb311d9
          test -z "$(git -C /tmp/glrd/candidate status --porcelain --untracked-files=no)"
      - name: Run PR2 baseline real standalone workflow and download actual enriched XML
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version | tee /tmp/glrd/outputs/chrome-version.txt
          node tests/glrd_issue9_standalone_shell_click_download.mjs \
            --root /tmp/glrd/phase1 --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs/ui-baseline --label baseline \
            --expected-sha 814157b162b981c9876f564f3cb0474435c8c37e \
            --chromium "$CHROME_BIN"
      - name: Run PR10 candidate real standalone workflow and download actual enriched XML
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node tests/glrd_issue9_standalone_shell_click_download.mjs \
            --root /tmp/glrd/candidate --xml /tmp/glrd/inputs/source.xml \
            --staged /tmp/glrd/inputs/staged.json --config /tmp/glrd/inputs/config.json \
            --linelist /tmp/glrd/inputs/linelist.xlsx \
            --piping-class /tmp/glrd/inputs/piping-class.json \
            --weight /tmp/glrd/inputs/weight.json \
            --material-map /tmp/glrd/inputs/material-map.txt \
            --out /tmp/glrd/outputs/ui-candidate --label optimized \
            --expected-sha 2b2939051bcd1f24e01163996f890168cfb311d9 \
            --chromium "$CHROME_BIN"
      - name: Compare genuine UI generated job, browser download bytes, and engineering facts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          out=Path('/tmp/glrd/outputs')
          qa,qb=(out/'ui-baseline',out/'ui-candidate')
          a,b=[json.loads((p/'glrd-shell-g3-download.json').read_text()) for p in (qa,qb)]
          assert a['status']==b['status']=='PASS',(a,b)
          assert a['inputs']==b['inputs'],'Fixture mismatch in UI qualification'
          A,B=a['observed'],b['observed']
          assert A['effectiveJobAuthority']==B['effectiveJobAuthority'], 'UI produced different effective workflow jobs'
          for obj in (A,B):
            assert obj['preview']['branchRows']==30,obj
            assert obj['preview']['dtxrRatingAction'] and obj['preview']['versionedCachePresent'],obj
            assert obj['popupSkipped']>=0 and obj['renderedDownloadEnabled'],obj
            assert obj['readinessDisabled'] is False,obj
          xa=(qa/'downloads'/a['download']['name']).read_bytes()
          xb=(qb/'downloads'/b['download']['name']).read_bytes()
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert sha(xa)==a['download']['sha256'] and sha(xb)==b['download']['sha256']
          n=min(len(xa),len(xb))
          first=next((i for i in range(n) if xa[i]!=xb[i]),None)
          if first is None and len(xa)!=len(xb):first=n
          context=lambda data: data[max(0,first-80):first+160].decode('utf-8',errors='replace') if first is not None else ''
          report={
             'schema':'glrd-ui-actual-download-before-after-v1','scope':'actual standalone workflow UI file import for source/stage, manual masterContext preloaded; not master-file UI upload or full app startup',
             'status':'PASS' if xa==xb else 'FAIL',
             'baselineCommit':a['commit'],'candidateCommit':b['commit'],
             'inputSha256':a['inputs'],
             'effectiveJobAuthority':A['effectiveJobAuthority'],
             'before':{'file':a['download']['name'],'bytes':len(xa),'sha256':sha(xa),'steps':A['steps']},
             'after':{'file':b['download']['name'],'bytes':len(xb),'sha256':sha(xb),'steps':B['steps']},
             'firstDifferentByte':first,'beforeContext':context(xa),'afterContext':context(xb),
             'fullByteIdentity':xa==xb,
             'note':'Historical 820150-byte direct-service oracle has fewer effective options than UI; not used for this equal-input UI-to-UI gate'
          }
          (out/'ui-actual-download-before-after.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert report['status']=='PASS','Engineering/UI downloaded XML parity FAILED'
          PY
      - name: Preserve actual before-after UI downloaded XML files and report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glrd-real-ui-before-after-actual-xml-downloads
          path: /tmp/glrd/outputs/
          if-no-files-found: warn
          retention-days: 14
